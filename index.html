<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Controle Remoto TV Wi-Fi - Leleco</title>
    <meta name="description" content="Aplicativo Android PWA de controle remoto Wi-Fi para Smart TVs AOC e marcas universais com suporte a IP fixo e botões de volume, mudo, ligar/desligar." />
    
    <!-- PWA & Android Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Controle TV" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="shortcut icon" href="/icons/icon-192.png" />
  </head>
  <body class="bg-slate-950 text-slate-100 select-none antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA ServiceWorker registrado com sucesso:', reg.scope))
            .catch(err => console.log('Erro ao registrar ServiceWorker:', err));
        });
      }
    </script>
  </body>
</html>
